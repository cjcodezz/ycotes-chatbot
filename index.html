<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ycotes AI Advisor</title>
<style>
  :root {
    --bg: #0b1630;
    --panel: #111f3f;
    --panel2: #1a2b52;
    --border: #24375f;
    --text: #e9eef8;
    --muted: #9aa8c7;
    --accent: #ff7a1a;
    --accent-soft: #ff9a4d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 760px;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
  }

  /* Header */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .logo {
    width: 42px; height: 42px;
    border-radius: 12px;
    background: var(--accent);
    color: #fff;
    display: grid; place-items: center;
    font-weight: 800; font-size: 20px;
    flex-shrink: 0;
  }
  .title h1 { font-size: 17px; font-weight: 700; }
  .title p { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .online {
    display: inline-block; width: 8px; height: 8px;
    border-radius: 50%; background: #3ddc84; margin-right: 5px;
  }
  .icon-btn {
    width: 42px; height: 42px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--panel2);
    color: var(--text);
    font-size: 19px;
    cursor: pointer;
    flex-shrink: 0;
    display: grid; place-items: center;
    transition: background .2s, border-color .2s;
  }
  .icon-btn:hover { border-color: var(--accent); }
  .icon-btn.active { background: var(--accent); border-color: var(--accent); }
  #speakBtn { margin-left: auto; }

  /* Chat area */
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 18px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 16px;
    line-height: 1.5;
    font-size: 15px;
    overflow-wrap: anywhere;
    animation: pop .2s ease;
  }
  .bot { background: var(--panel2); align-self: flex-start; border-bottom-left-radius: 4px; }
  .user { background: var(--accent); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  .error { background: #3b1e22; border: 1px solid #7a3340; }
  .msg a { color: var(--accent-soft); }
  .user a { color: #fff; }

  .quick { display: flex; flex-wrap: wrap; gap: 8px; margin: 2px 0 6px; }
  .quick button {
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent-soft);
    padding: 8px 13px;
    border-radius: 999px;
    font-size: 14px;
    cursor: pointer;
    transition: background .2s, color .2s;
  }
  .quick button:hover { background: var(--accent); color: #fff; }

  /* Typing indicator */
  .typing { display: flex; gap: 5px; padding: 14px 16px; }
  .typing span {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: .15s; }
  .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-6px); opacity: 1; } }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* Input bar */
  form {
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 12px;
    background: var(--panel);
    border-top: 1px solid var(--border);
  }
  #input {
    flex: 1;
    min-width: 0;
    padding: 12px 16px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 16px;
    outline: none;
  }
  #input:focus { border-color: var(--accent); }
  #input::placeholder { color: var(--muted); }
  #micBtn.listening { background: #e53935; border-color: #e53935; animation: pulse 1.2s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(229,57,53,.6); } 100% { box-shadow: 0 0 0 12px rgba(229,57,53,0); } }
  #sendBtn { background: var(--accent); border-color: var(--accent); color: #fff; }
  #sendBtn:disabled { opacity: .5; cursor: not-allowed; }
  .note { text-align: center; font-size: 11px; color: var(--muted); padding: 0 12px 8px; background: var(--panel); }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">Y</div>
    <div class="title">
      <h1>Ycotes AI Advisor</h1>
      <p><span class="online"></span>Online · Course guidance in seconds</p>
    </div>
    <button class="icon-btn" id="speakBtn" type="button" title="Read replies aloud" aria-label="Turn voice replies on">🔇</button>
  </header>

  <main id="chat" aria-live="polite"></main>

  <form id="form" autocomplete="off">
    <button class="icon-btn" id="micBtn" type="button" title="Speak your question" aria-label="Speak your question">🎤</button>
    <input id="input" type="text" placeholder="Type your question..." maxlength="500" aria-label="Your question">
    <button class="icon-btn" id="sendBtn" type="submit" title="Send" aria-label="Send">➤</button>
  </form>
  <div class="note">AI answers can be imperfect. For fees & batches: +91 92169 88327</div>
</div>

<script>
  const chat = document.getElementById('chat');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const micBtn = document.getElementById('micBtn');
  const speakBtn = document.getElementById('speakBtn');

  const history = [];   // { role: 'user' | 'bot', text: '...' }
  let busy = false;
  let speakOn = false;

  const WELCOME = "Hi! 👋 I'm the Ycotes AI Advisor. Tell me your goal and I'll suggest the best course for you. You can type, or tap the 🎤 mic to speak.";
  const QUICK = ["Which course is best for me?", "Do you have AI courses?", "How do I enrol?", "Talk to the team"];
  const ERROR_TEXT = "Sorry, I couldn't connect right now 😕 Please try again in a moment, or call/WhatsApp us at +91 92169 88327 or email team@theycotes.com.";

  // ---------- Helpers ----------
  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function formatText(text) {
    let html = escapeHtml(text);
    html = html.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
    html = html.replace(/\b([\w.+-]+@[\w-]+\.[\w.]+)\b/g, '<a href="mailto:$1">$1</a>');
    html = html.replace(/\n/g, '<br>');
    return html;
  }
  function scrollDown() { chat.scrollTop = chat.scrollHeight; }

  function addMessage(role, text, extraClass) {
    const div = document.createElement('div');
    div.className = 'msg ' + (role === 'user' ? 'user' : 'bot') + (extraClass ? ' ' + extraClass : '');
    div.innerHTML = formatText(text);
    chat.appendChild(div);
    scrollDown();
    return div;
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'msg bot typing';
    div.setAttribute('aria-label', 'Advisor is typing');
    div.innerHTML = '<span></span><span></span><span></span>';
    chat.appendChild(div);
    scrollDown();
    return div;
  }

  function setBusy(state) {
    busy = state;
    sendBtn.disabled = state;
  }

  // ---------- Send a message ----------
  async function send(text) {
    text = (text || '').trim();
    if (!text || busy) return;

    addMessage('user', text);
    history.push({ role: 'user', text: text });
    input.value = '';
    setBusy(true);
    const typing = showTyping();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history.slice(-10) })
      });
      const data = await res.json().catch(function () { return {}; });
      if (!res.ok || !data.reply) throw new Error(data.error || 'Request failed');

      typing.remove();
      addMessage('bot', data.reply);
      history.push({ role: 'bot', text: data.reply });
      speak(data.reply);
    } catch (err) {
      console.error(err);
      typing.remove();
      addMessage('bot', ERROR_TEXT, 'error');
    } finally {
      setBusy(false);
      input.focus();
    }
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    send(input.value);
  });

  // ---------- Welcome + quick buttons ----------
  addMessage('bot', WELCOME);
  const quickBox = document.createElement('div');
  quickBox.className = 'quick';
  QUICK.forEach(function (q) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = q;
    b.addEventListener('click', function () { send(q); });
    quickBox.appendChild(b);
  });
  chat.appendChild(quickBox);

  // ---------- Voice output (speaker) ----------
  const canSpeak = 'speechSynthesis' in window;
  let voice = null;

  function pickVoice() {
    const voices = window.speechSynthesis.getVoices();
    const norm = function (l) { return (l || '').replace('_', '-').toLowerCase(); };
    voice = voices.find(function (v) { return norm(v.lang) === 'en-in'; })
         || voices.find(function (v) { return /india/i.test(v.name); })
         || voices.find(function (v) { return norm(v.lang).indexOf('en') === 0; })
         || null;
  }
  if (canSpeak) {
    pickVoice();
    window.speechSynthesis.onvoiceschanged = pickVoice;
  }

  function speak(text) {
    if (!speakOn || !canSpeak) return;
    window.speechSynthesis.cancel();
    const clean = text.replace(/[*_#`>]/g, '').replace(/\s+/g, ' ').trim();
    const u = new SpeechSynthesisUtterance(clean);
    u.lang = 'en-IN';
    if (voice) u.voice = voice;
    u.rate = 1;
    window.speechSynthesis.speak(u);
  }

  speakBtn.addEventListener('click', function () {
    if (!canSpeak) {
      addMessage('bot', "Sorry, voice replies aren't supported in this browser. Please try Chrome or Edge.");
      return;
    }
    speakOn = !speakOn;
    speakBtn.textContent = speakOn ? '🔊' : '🔇';
    speakBtn.classList.toggle('active', speakOn);
    speakBtn.setAttribute('aria-label', speakOn ? 'Turn voice replies off' : 'Turn voice replies on');
    if (speakOn) {
      speak('Voice replies are on.');
    } else {
      window.speechSynthesis.cancel();
    }
  });

  // ---------- Voice input (mic) ----------
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognizer = null;
  let listening = false;
  let finalText = '';

  function setListening(state) {
    listening = state;
    micBtn.classList.toggle('listening', state);
    input.placeholder = state ? 'Listening... speak now' : 'Type your question...';
  }

  if (SpeechRec) {
    recognizer = new SpeechRec();
    recognizer.lang = 'en-IN';
    recognizer.interimResults = true;
    recognizer.continuous = false;
    recognizer.maxAlternatives = 1;

    recognizer.onresult = function (event) {
      let text = '';
      for (let i = 0; i < event.results.length; i++) {
        text += event.results[i][0].transcript;
      }
      input.value = text;
      if (event.results[event.results.length - 1].isFinal) finalText = text;
    };

    recognizer.onerror = function (event) {
      setListening(false);
      if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
        addMessage('bot', 'Please allow microphone access in your browser to use voice input 🎤');
      } else if (event.error === 'no-speech') {
        addMessage('bot', "I didn't hear anything. Tap the 🎤 and try again.");
      }
    };

    recognizer.onend = function () {
      setListening(false);
      const text = finalText || input.value;
      finalText = '';
      if (text.trim()) send(text);
    };
  }

  micBtn.addEventListener('click', function () {
    if (!recognizer) {
      addMessage('bot', "Sorry, voice input isn't supported in this browser. Please use Chrome or Edge, or just type your question.");
      return;
    }
    if (busy) return;
    if (listening) { recognizer.stop(); return; }
    if (canSpeak) window.speechSynthesis.cancel();
    finalText = '';
    input.value = '';
    try {
      recognizer.start();
      setListening(true);
    } catch (e) {
      setListening(false);
    }
  });
</script>
</body>
</html>
